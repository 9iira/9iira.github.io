{{- if .Context.IsHome -}}
{{- $placement := default "sidebar" .Placement -}}
{{- with hugo.Data.home_note -}}
<section class="widget home-note home-note--{{ $placement }}" aria-labelledby="home-note-title-{{ $placement }}">
  <h2 id="home-note-title-{{ $placement }}" class="home-note-title">{{ .title | default "Note" }}</h2>
  <div class="home-note-content">{{ .content | markdownify }}</div>
</section>
<style>
.home-note {
  box-sizing: border-box;
  width: 100%;
  min-width: 0;
  padding: 22px 24px;
  background: var(--card-background);
  color: var(--card-text-color-main);
  border-radius: var(--card-border-radius);
  box-shadow: var(--shadow-l1);
}
.home-note-title {
  margin: 0 0 12px;
  color: var(--accent-color);
  font-size: 1.8rem;
  font-weight: 600;
  line-height: 1.4;
}
.home-note-content {
  font-size: 1.5rem;
  line-height: 1.8;
  overflow-wrap: anywhere;
}
.home-note-content > :first-child { margin-top: 0; }
.home-note-content > :last-child { margin-bottom: 0; }
.home-note-content p { margin: .7em 0; }
.home-note-content ul,
.home-note-content ol { padding-left: 1.4em; }
.home-note-content a { color: var(--accent-color); text-decoration: underline; text-underline-offset: 3px; }
.home-note-content img { max-width: 100%; height: auto; }
.home-note--mobile { display: block; }
@media (min-width: 1024px) {
  .home-note--mobile { display: none; }
}
</style>
{{- end -}}
{{- end -}}
