{{ if .IsHome }}
<style>
  #ink-intro {
    position: fixed;
    inset: 0;
    z-index: 2147483647;
    overflow: hidden;
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: 1fr;
    justify-items: center;
    background: #fff;
    color: #343944;
    cursor: pointer;
    animation: ink-veil 2.8s linear forwards;
  }
  #ink-intro span {
    writing-mode: vertical-rl;
    text-orientation: sideways;
    white-space: pre;
    align-self: center;
    font: 500 clamp(14px, 1.4vw, 20px)/1 Consolas, monospace;
    letter-spacing: .12em;
    opacity: 0;
    animation: ink-thread 1.85s ease-out var(--delay) both;
  }
  @keyframes ink-thread {
    from { opacity: 0; transform: translateY(calc(var(--offset) - 32px)); }
    35% { opacity: var(--ink); }
    to { opacity: var(--ink); transform: translateY(var(--offset)); }
  }
  @keyframes ink-veil {
    0%, 72% { opacity: 1; }
    100% { opacity: 0; visibility: hidden; }
  }
  @media (prefers-reduced-motion: reduce) { #ink-intro { display: none; } }
</style>
<script>
(() => {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const key = 'itsukazuki-morse-intro-v2';
  try { if (sessionStorage.getItem(key)) return; } catch {}
    // I WANTED TO DANCE IN YOUR PULSE
  // 空格分隔字母，斜线分隔单词。
    const lines = [
    '... --- .-.. .. - ..- -.. .. -. .. ...',       // Solitudinis
    '.- ... .--. . .-. .. - .- - .. ...',          // Asperitatis
    '.--. . .-. ... . ...- . .-. .- -. - .. .-',   // Perseverantia
    '-.. --- .-.. --- .-. .. ...',                 // Doloris
    '... --- -- -. .. --- .-. ..- --',             // Somniorum
    '-.-. .-. . ... -.-. . -. -',                  // Crescent
    '.-.. .- -.-. ..- ... / --- -.. .. ..'         // Lacus odii
  ];
  function show() {
    const veil = document.createElement('div');
    veil.id = 'ink-intro';
    veil.setAttribute('aria-hidden', 'true');
    const count = Math.max(5, Math.min(23, Math.floor(innerWidth / 48)));
    for (let i = 0; i < count; i++) {
      const column = document.createElement('span');
      column.textContent = lines[i % lines.length].replaceAll('.', '·').replaceAll('-', '−');
      column.style.setProperty('--offset', ((i * 17) % 37 - 18) + 'vh');
      column.style.setProperty('--delay', ((i * 7) % 11) * 38 + 'ms');
      column.style.setProperty('--ink', String(0.23 + ((i * 7) % 5) * 0.065));
      veil.append(column);
    }
    document.body.prepend(veil);
    try { sessionStorage.setItem(key, '1'); } catch {}
    function finish() {
      veil.remove();
      document.removeEventListener('keydown', finish);
    }
    veil.addEventListener('click', finish);
    document.addEventListener('keydown', finish);
    setTimeout(finish, 2850);
  }
  if (document.body) show();
  else {
    const observer = new MutationObserver(() => {
      if (document.body) { observer.disconnect(); show(); }
    });
    observer.observe(document.documentElement, { childList: true });
  }
})();
</script>
{{ end }}


{{ $lightIcon := resources.Get "img/favicon-light.png" }}
{{ $darkIcon := resources.Get "img/favicon-dark.png" }}

{{ if and $lightIcon $darkIcon }}
<script>
(() => {
  const lightIcon = "{{ $lightIcon.RelPermalink }}";
  const darkIcon = "{{ $darkIcon.RelPermalink }}";

  function updateFavicon() {
    const isDark =
      document.documentElement.dataset.scheme === "dark";

    const url = isDark ? darkIcon : lightIcon;
    let icons = document.querySelectorAll('link[rel~="icon"]');

    if (!icons.length) {
      const icon = document.createElement("link");
      icon.rel = "icon";
      document.head.appendChild(icon);
      icons = [icon];
    }

    icons.forEach(icon => {
      icon.type = "image/png";
      icon.href = url;
    });
  }

  updateFavicon();

  new MutationObserver(updateFavicon).observe(
    document.documentElement,
    {
      attributes: true,
      attributeFilter: ["data-scheme"]
    }
  );
})();
</script>
{{ end }}
