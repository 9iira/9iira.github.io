{{ if and .IsPage (eq .Section "post") }}
<div id="post-kudos" style="text-align: center; margin: 2rem 0;">
 <span class="likebtn-wrapper"
      data-identifier="{{ .RelPermalink }}"
      data-theme="custom"
      data-icon_like_show="false"
      data-show_like_label="true"
      data-i18n_like="♡"
      data-i18n_after_like="♥︎"
      data-i18n_like_tooltip="送出 Kudos"
      data-i18n_unlike_tooltip="已送出 Kudos"
      data-label_c="#707070"
      data-label_c_v="#707070"
      data-counter_l_c="#707070"
      data-bg_c="transparent"
      data-bg_c_v="transparent"
      data-brdr_c="transparent"
      data-f_size="20"
      data-dislike_enabled="false">
</span>
</div>

<script>
  const articleBody = document.querySelector(".main-article .article-content");
  const kudos = document.getElementById("post-kudos");
  if (articleBody && kudos) {
    articleBody.append(kudos);
  }
</script>
<script async src="https://w.likebtn.com/js/w/widget.js"></script>
{{ end }}

// 时间统计和字数统计
{{ $totalWords := 0 }}
{{ range where .Site.RegularPages "Section" "post" }}
  {{ $totalWords = add $totalWords .WordCount }}
{{ end }}

<div id="blog-stats" class="powerby" style="margin-top: 0.4em;">
  <span id="blog-uptime"></span>
  文章共 {{ lang.FormatNumber 0 $totalWords }} 字
</div>

<script>
(() => {
  const stats = document.getElementById("blog-stats");
  const copyright = document.querySelector(".site-footer .copyright");
  if (copyright) copyright.after(stats);

  // 开站时间：年-月-日，T 后面是时:分:秒，+01:00 是斯德哥尔摩冬令时。
  const openedAt = Date.parse("2026-11-04T00:00:00+01:00");
  const uptime = document.getElementById("blog-uptime");

  function updateUptime() {
    const hours = Math.max(0, Math.floor((Date.now() - openedAt) / 3600000));
    const days = Math.floor(hours / 24);
    uptime.textContent = `博客已运行 ${days} 天 ${hours % 24} 小时 · `;
  }

  updateUptime();
  setInterval(updateUptime, 60000);
})();
</script>
