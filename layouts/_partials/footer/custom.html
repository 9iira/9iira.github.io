
{{ $totalWords := 0 }}
{{ range where .Site.RegularPages "Section" "post" }}
{{ $totalWords = add $totalWords .WordCount }}
{{ end }}
<div id="blog-stats" class="powerby" style="margin-top: 0.4em;">
  <span id="blog-uptime"></span>
  共 {{ lang.FormatNumber 1 (div (float $totalWords) 1000) }} 千字
</div><script>
(() => {
  const stats = document.getElementById("blog-stats");
  const copyright = document.querySelector(".site-footer .copyright");

  if (copyright) {
    if (!copyright.querySelector(".rights-reserved")) {
      const rights = document.createElement("span");
      rights.className = "rights-reserved";
      rights.textContent = " · All Rights Reserved.";
      copyright.appendChild(rights);
    }

    copyright.after(stats);
  }

  // 开站时间：年-月-日，T 后面是时:分:秒，+01:00 是斯德哥尔摩冬令时。
  const openedAt = Date.parse("2026-11-04T00:00:00+01:00");
  const uptime = document.getElementById("blog-uptime");

  function updateUptime() {
    const hours = Math.max(0, Math.floor((Date.now() - openedAt) / 3600000));
    const days = Math.floor(hours / 24);
    uptime.textContent = `博客已运行 ${days} 天 ${hours % 24} 小时 · `;
  }

  updateUptime();
  setInterval(updateUptime, 60000);
})();
</script>

{{ if and .IsPage (eq .Section "post") }}
<style>
  #reading-progress {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 3px;
    background: #34495E;
    transform: scaleX(0);
    transform-origin: left center;
    pointer-events: none;
    z-index: 2000;
  }

  :root[data-scheme="dark"] #reading-progress {
    background: #B7CBE0;
  }
</style>

<div id="reading-progress" aria-hidden="true"></div>

<script>
(() => {
  const bar = document.getElementById("reading-progress");
  const article = document.querySelector(".main-article .article-content");
  if (!bar || !article) return;

  let scheduled = false;

  function update() {
    scheduled = false;

    const rect = article.getBoundingClientRect();
    const scrollY = window.scrollY;
    const start = Math.max(0, rect.top + scrollY - 80);
    const end = rect.bottom + scrollY - window.innerHeight;

    // 正文能在一屏内显示时，进入阅读位置即视为读完。
    const progress = end > start
      ? (scrollY - start) / (end - start)
      : (scrollY >= end ? 1 : 0);

    bar.style.transform =
      `scaleX(${Math.max(0, Math.min(1, progress))})`;
  }

  function scheduleUpdate() {
    if (scheduled) return;
    scheduled = true;
    requestAnimationFrame(update);
  }

  window.addEventListener("scroll", scheduleUpdate, { passive: true });
  window.addEventListener("resize", scheduleUpdate);
  window.addEventListener("load", scheduleUpdate);
  window.addEventListener("pageshow", scheduleUpdate);

  // 图片、字体加载导致正文高度变化时，重新计算。
  if ("ResizeObserver" in window) {
    const observer = new ResizeObserver(scheduleUpdate);
    observer.observe(article);
    observer.observe(document.body);
  }

  update();
})();
</script>
{{ end }}
