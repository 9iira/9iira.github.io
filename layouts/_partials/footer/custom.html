{{ if and .IsPage (eq .Section "post") }}
<div id="post-kudos" style="text-align: center; margin: 2rem 0;">
 <span class="likebtn-wrapper"
      data-identifier="{{ .RelPermalink }}"
      data-theme="custom"
      data-icon_like_show="false"
      data-show_like_label="true"
      data-i18n_like="♡"
      data-i18n_after_like="♥︎"
      data-i18n_like_tooltip="送出 Kudos"
      data-i18n_unlike_tooltip="已送出 Kudos"
      data-label_c="#707070"
      data-label_c_v="#707070"
      data-counter_l_c="#707070"
      data-bg_c="transparent"
      data-bg_c_v="transparent"
      data-brdr_c="transparent"
      data-f_size="20"
      data-dislike_enabled="false">
</span>
</div>

<script>
  const articleBody = document.querySelector(".main-article .article-content");
  const kudos = document.getElementById("post-kudos");
  if (articleBody && kudos) {
    articleBody.append(kudos);
  }
</script>
<script async src="https://w.likebtn.com/js/w/widget.js"></script>
{{ end }}
