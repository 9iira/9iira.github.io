# Pages placed under these sections will be shown on homepage and archive page.
mainSections = ["post"]
# Output page's full content in RSS.
rssFullContent = true
favicon        = "img/favicon.png"

# Accepted values: "default", "lastmod"
# default = see https://gohugo.io/quick-reference/glossary/#default-sort-order
# lastmod = sort by last modified date, in descending order
SortBy              = "default"

[footer]
    since      = 2026
    customText = ".. .-- .- -. - . -.. - --- -.. .- -. -.-. . .. -. -.-- --- ..- .-. .--. ..- .-.. ... ."

[dateFormat]
    published   = ":date_full"
    lastUpdated = ":date_full"

[sidebar]
    emoji    = "🍺"
    subtitle = "死是凉爽的夏夜"
    avatar   = "img/呆猫.gif"

[article]
    headingAnchor = false
    math          = false
    readingTime   = true

    [article.license]
        enabled = true
        default = "All Rights Reserved."

[widgets]
    homepage = [
        { type = "search" },
        { type = "archives", params = { limit = 5 } },
        { type = "categories", params = { limit = 10 } },
        { type = "tag-cloud", params = { limit = 10 } },
    ]
    page = [{ type = "toc" }]

[opengraph.twitter]
    site = ""
    card = "summary_large_image"

[colorScheme]
    toggle  = true
    default = "auto"


[comments]
    enabled = true
    provider = "waline"

[comments.waline]
    serverURL = "https://comments.itsukazuki.homes"
    lang = "zh-CN"
    meta = ["nick", "mail"]
    search = false
    
    reaction = ["data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 20.4s-7.6-4.7-7.6-9.8a4.3 4.3 0 0 1 7.6-2.7 4.3 4.3 0 0 1 7.6 2.7c0 5.1-7.6 9.8-7.6 9.8z' fill='none' stroke='%23444' stroke-width='1.6'/%3E%3C/svg%3E"]

[comments.waline.locale]
    submit = "Wer!"
    placeholder = "留下点什么再走吧；；"
    sofa = "这里现在什么都没有；；"
    reaction0 = "Kudos"
    comment = "留言"
    login = "登记"
    logout = "离开"
    nick = "昵称（这个得有）"
    mail = "邮箱（这个可以没有）"

    # See all the available configurations at https://github.com/CaiJimmy/hugo-theme-stack/blob/master/config/_default/params.toml
    # Copy the configurations you need from there and paste it here.
